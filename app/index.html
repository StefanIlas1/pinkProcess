<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinkProcess</title>
<style>
  :root { --ink: #111; --line: #c9c9c9; --soft: #f4f4f4; --mute: #6b6b6b; --pink: #ff5fa2; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); background: #fff;
         display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--ink); }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand span { font: 800 24px/1 ui-rounded, "Arial Rounded MT Bold", "Nunito", sans-serif; color: var(--pink);
                letter-spacing: -0.5px; }
  .status { margin-left: auto; font: 12px ui-monospace, Menlo, monospace; display: flex; gap: 14px; align-items: center; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); margin-right: 6px; }
  button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--ink); padding: 6px 12px; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--ink); color: #fff; outline: none; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
  .work { padding: 28px 32px; overflow: auto; }
  form { display: flex; border: 2px solid var(--ink); }
  input { flex: 1; font: 20px/1.2 inherit; padding: 16px 18px; border: 0; outline: none; min-width: 0; }
  form button { border: 0; border-left: 2px solid var(--ink); font-weight: 700; padding: 0 26px; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 26px; }
  .chips button { font-size: 13px; border-color: var(--line); color: var(--mute); padding: 4px 10px; }
  .where { font: 12px ui-monospace, Menlo, monospace; color: var(--mute); margin-bottom: 6px; min-height: 18px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 16px; letter-spacing: -0.5px; }
  table { width: 100%; border-collapse: collapse; }
  td { border: 1px solid var(--line); padding: 12px 14px; font-size: 18px; vertical-align: top; }
  td.n { width: 44px; text-align: center; background: var(--soft); font: 13px ui-monospace, Menlo, monospace;
         color: var(--mute); padding-top: 16px; }
  .urgent { margin-top: 16px; border: 2px solid var(--ink); padding: 12px 14px; font-weight: 700; font-size: 16px; }
  .notice { margin-top: 12px; font-size: 12px; color: var(--mute); }
  .refused { border: 2px solid var(--ink); padding: 22px; font-size: 20px; }
  .refused small { display: block; margin-top: 8px; font-size: 14px; color: var(--mute); }
  aside { border-left: 1px solid var(--ink); padding: 18px; overflow: auto; font: 12px ui-monospace, Menlo, monospace; }
  aside h2 { font: 700 11px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase;
             margin: 0 0 8px; }
  dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; margin: 0 0 20px; }
  dt { color: var(--mute); } dd { margin: 0; text-align: right; }
  .bar { display: grid; grid-template-columns: 78px 1fr 44px; gap: 6px; align-items: center; margin-bottom: 3px; }
  .bar i { display: block; height: 9px; background: var(--ink); min-width: 1px; }
  .bar.off i { background: var(--line); }
  .bar b { font-weight: 400; text-align: right; }
  footer { display: flex; border-top: 1px solid var(--ink); background: var(--soft); overflow-x: auto; }
  footer button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 9px 20px; white-space: nowrap; }
  footer button[aria-selected="true"] { background: #fff; font-weight: 700; box-shadow: inset 0 3px 0 var(--ink); }
  footer button:hover { background: #fff; color: var(--ink); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--ink); } }
</style>
</head>
<body>
<header>
  <div class="brand" aria-label="pinkProcess">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="17" r="15" fill="#ff5fa2"/>
      <circle cx="9" cy="6" r="4.5" fill="#ff5fa2"/><circle cx="31" cy="6" r="4.5" fill="#ff5fa2"/>
      <circle cx="14.5" cy="16" r="1.9" fill="#111"/><circle cx="25.5" cy="16" r="1.9" fill="#111"/>
      <path d="M17 21.5 q3 2.4 6 0" fill="none" stroke="#111" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M9 29 l11 4 l11 -4 l2 10 h-26 z" fill="#111"/>
      <path d="M15 30.5 l5 3 l5 -3 l-5 -2 z" fill="#fff"/>
      <path d="M20 32 l-1.8 2 l1.8 6 l1.8 -6 z" fill="#ff5fa2"/>
    </svg>
    <span>pink process</span>
  </div>
  <div class="status">
    <span><span class="dot"></span><span id="backend">connecting</span></span>
    <button id="full" type="button">Full screen</button>
  </div>
</header>
<main>
  <section class="work">
    <form id="ask">
      <input id="question" autocomplete="off" autofocus placeholder="What is happening?" aria-label="Question">
      <button type="submit">Ask</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="where" id="where"></div>
    <div id="answer"></div>
  </section>
  <aside>
    <h2>Cartridge</h2>
    <dl>
      <dt>loaded</dt><dd id="mLoaded">-</dd>
      <dt>weights</dt><dd id="mBytes">-</dd>
      <dt>cards</dt><dd id="mCards">-</dd>
      <dt>switch</dt><dd id="mSwitch">-</dd>
    </dl>
    <h2>Last decision</h2>
    <dl>
      <dt>time</dt><dd id="mTime">-</dd>
      <dt>words used</dt><dd id="mFeatures">-</dd>
      <dt>margin</dt><dd id="mMargin">-</dd>
    </dl>
    <h2>Scores</h2>
    <div id="scores"></div>
  </aside>
</main>
<footer id="tabs" role="tablist"></footer>
<script>
const state = { cartridges: [], selected: "auto", loaded: null };
const byId = (id) => document.getElementById(id);
const make = (tag, text, className) => {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
};
const find = (name) => state.cartridges.find((item) => item.name === name);

function renderTabs() {
  const tabs = byId("tabs");
  tabs.replaceChildren();
  [{ name: "auto", title: "Auto" }, ...state.cartridges].forEach((item) => {
    const tab = make("button", item.title);
    tab.type = "button";
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", String(state.selected === item.name));
    tab.onclick = () => { state.selected = item.name; renderTabs(); renderChips(); byId("question").focus(); };
    tabs.append(tab);
  });
}

function renderChips() {
  const chips = byId("chips");
  chips.replaceChildren();
  const pool = state.selected === "auto"
    ? state.cartridges.map((item) => item.examples[0])
    : find(state.selected).examples;
  pool.forEach((text) => {
    const chip = make("button", text);
    chip.type = "button";
    chip.onclick = () => { byId("question").value = text; ask(text); };
    chips.append(chip);
  });
  byId("question").placeholder = state.selected === "auto" ? "What is happening?" : find(state.selected).tagline;
}

function renderMeta(name) {
  const item = find(name);
  byId("mLoaded").textContent = item.title;
  byId("mBytes").textContent = (item.weight_bytes / 1024).toFixed(0) + " KB int8";
  byId("mCards").textContent = item.cards;
}

function renderAnswer(reply) {
  const item = find(reply.cartridge);
  const answer = byId("answer");
  answer.replaceChildren();
  byId("where").textContent = reply.answered ? (reply.switched ? "switched to " : "") + item.title.toLowerCase() : "";
  if (!reply.answered) {
    const box = make("div", "That is outside what I know.", "refused");
    box.append(make("small", "Loaded cartridges: " + state.cartridges.map((c) => c.title).join(", ") + "."));
    answer.append(box);
  } else {
    answer.append(make("h1", reply.card.title));
    const table = make("table");
    reply.card.steps.forEach((step, index) => {
      const row = make("tr");
      row.append(make("td", String(index + 1), "n"), make("td", step));
      table.append(row);
    });
    answer.append(table, make("div", reply.card.urgent, "urgent"), make("div", item.notice, "notice"));
  }
  renderMeta(reply.cartridge);
  byId("mSwitch").textContent = reply.switch_microseconds.toFixed(1) + " µs";
  byId("mTime").textContent = reply.microseconds.toFixed(1) + " µs";
  byId("mFeatures").textContent = reply.active_features;
  byId("mMargin").textContent = reply.margin;
  const scores = byId("scores");
  scores.replaceChildren();
  const entries = Object.entries(reply.scores);
  const low = Math.min(...entries.map(([, value]) => value));
  const span = Math.max(1, Math.max(...entries.map(([, value]) => value)) - low);
  entries.sort((a, b) => b[1] - a[1]).forEach(([label, value]) => {
    const row = make("div", undefined, "bar" + (label === "refuse" ? " off" : ""));
    const fill = make("i");
    fill.style.width = Math.round(100 * (value - low) / span) + "%";
    row.append(make("span", label), fill, make("b", String(value)));
    scores.append(row);
  });
}

async function ask(question) {
  if (!question.trim()) return;
  const response = await fetch("/api/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, cartridge: state.selected }),
  });
  renderAnswer(await response.json());
}

byId("ask").onsubmit = (event) => { event.preventDefault(); ask(byId("question").value); };
byId("full").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

fetch("/api/state").then((response) => response.json()).then((data) => {
  state.cartridges = data.cartridges;
  byId("backend").textContent = data.backend;
  renderTabs();
  renderChips();
  renderMeta(data.active);
});
</script>
</body>
</html>
